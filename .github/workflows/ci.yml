name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      runner:
        description: "ubuntu-latest (GitHub-hosted), desktop (self-hosted x64), mac-local (self-hosted arm64)"
        type: choice
        options: [ubuntu-latest, desktop, mac-local]
        default: ubuntu-latest

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ (inputs.runner == '' || inputs.runner == 'ubuntu-latest') && 'ubuntu-latest' || fromJSON(format('["self-hosted","{0}"]', inputs.runner == 'self-hosted' && 'mac-local' || inputs.runner)) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: check
    runs-on: ${{ (inputs.runner == '' || inputs.runner == 'ubuntu-latest') && 'ubuntu-latest' || fromJSON(format('["self-hosted","{0}"]', inputs.runner == 'self-hosted' && 'mac-local' || inputs.runner)) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
